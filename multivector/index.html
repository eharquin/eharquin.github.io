<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GAMUT has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://eharquin.github.io/gamut/" />
    <script>
      // Forward /multivector/… to /gamut/…, keeping the query and the fragment
      // (#scene=… links). Same origin, so saved documents carry over.
      (function () {
        var location = window.location;
        var rest = location.pathname.replace(/^\/multivector\/?/, "");
        location.replace("/gamut/" + rest + location.search + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/gamut/" />
  </head>
  <body>
    <p>GAMUT has moved to <a href="/gamut/">https://eharquin.github.io/gamut/</a>.</p>
  </body>
</html>
